<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить место - ShawarmaMap</title>
    <link rel="stylesheet" th:href="@{/css/fragments/header-fragment.css}">
    <link rel="stylesheet" th:href="@{/css/public/add-place-page.css}">
</head>
<body>
<div th:replace="~{fragments/header-fragment :: header}"></div>

<main class="form-container">
    <div class="card">
        <h1>Добавить новую точку</h1>
        <p>Знаешь место, где готовят божественную шаурму? Поделись с другими!</p>

        <form th:action="@{/add-place-page}" th:object="${newPlace}" method="post">
            <div class="form-group">
                <label>Название заведения</label>
                <input type="text" th:field="*{name}" placeholder="Например: У Заура" required maxlength="50">
            </div>

            <div class="form-group">
                <label>Город</label>
                <input type="text" th:field="*{city}" placeholder="Например: Москва" required maxlength="50">
            </div>

            <div class="form-group">
                <label>Адрес</label>
                <input type="text" th:field="*{address}" placeholder="Например: ул. Пушкина, д. 10" required maxlength="100">
            </div>

            <button type="submit" class="btn-save">Опубликовать</button>
        </form>
    </div>
</main>
</body>
</html>
