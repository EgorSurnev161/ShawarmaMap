<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> <!-- ИСПРАВЛЕНО ЗДЕСЬ -->
<head>
    <meta charset="UTF-8">
    <title>Детали места - ShawarmaMap</title>
    <link rel="stylesheet" th:href="@{/css/fragments/header-fragment.css}">
    <link rel="stylesheet" th:href="@{/css/public/place-shawarma.css}">
</head>
<body>
<div th:replace="~{fragments/header-fragment :: header}"></div>

<main class="container">
    <!-- Верхний блок с информацией -->
    <section class="place-header">
        <h1 th:text="${place.name}">Название Шаурмы</h1>
        <p class="full-address">📍 [[${place.city}]], [[${place.address}]]</p>

        <div class="main-stats">
            <button class="stat-btn like-btn">👍 [[${place.numberOfLikes}]]</button>
            <button class="stat-btn dislike-btn">👎 [[${place.numberOfDislikes}]]</button>
        </div>
    </section>

    <!-- Секция комментариев -->
    <section class="comments-section">
        <h2>Отзывы клиентов</h2>

        <!-- ИСПРАВЛЕНА ФОРМА ДОБАВЛЕНИЯ КОММЕНТАРИЯ -->
        <form class="comment-form"
              th:action="@{/place/{id}/add-comment(id=${place.id})}"
              method="post">
            <textarea name="comment" placeholder="Поделитесь своим мнением..." required></textarea>
            <button type="submit" class="btn-send">Отправить отзыв</button>
        </form>

        <!-- Список комментариев -->
        <div class="comments-list" th:if="${!comments.isEmpty()}">
            <div class="comment-item" th:each="c : ${comments}">
                <div class="comment-meta">
                    <strong th:text="${c.user.name}">Имя</strong> •
                    <span th:text="${#temporals.format(c.date, 'dd.MM.yyyy')}">дата</span>

                    <!-- Форма удаления (скрыта для обычных юзеров) -->
                    <form sec:authorize="hasAnyRole('ADMIN', 'SUPER_ADMIN')"
                          th:action="@{/place/{pId}/delete-comment(pId=${place.id})}"
                          method="post"
                          style="display: inline-block; margin-left: 10px;">

                        <!-- Скрытое поле с ID комментария -->
                        <input type="hidden" name="commentId" th:value="${c.id}" />

                        <button type="submit" class="btn-delete"
                                style="color: red; cursor: pointer; background: none; border: none; font-size: 14px;"
                                onclick="return confirm('Вы уверены, что хотите удалить этот комментарий?')">
                            ✖ Удалить
                        </button>
                    </form>
                </div>
                <p class="comment-text" th:text="${c.text}">текст</p>
            </div>
        </div>
        <p th:if="${comments.isEmpty()}">Пока нет отзывов — будьте первым!</p>
    </section>
</main>
</body>
</html>
