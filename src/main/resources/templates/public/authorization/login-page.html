<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход - ShawarmaMap</title>
    <link rel="stylesheet" th:href="@{/css/fragments/header-fragment.css}">
    <link rel="stylesheet" th:href="@{/css/public/authorization/authorization-page.css}">
</head>
<body>
<!-- Подключаем наш общий хедер -->
<div th:replace="~{fragments/header-fragment :: header}"></div>

<div class="auth-container">
    <form class="auth-card" th:action="@{/login}" method="post">
        <h2>С возвращением! 🌯</h2>
        <p class="subtitle">Войдите, чтобы оценивать места и добавлять новые</p>

        <!-- Блок для вывода ошибок (например, если пароль неверный) -->
        <div th:if="${param.error}" class="alert alert-error">
            Неверный email или пароль. Попробуйте еще раз.
        </div>

        <!-- Блок для сообщения о выходе из системы -->
        <div th:if="${param.logout}" class="alert alert-info">
            Вы успешно вышли из системы.
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-auth">Войти</button>

        <div class="auth-footer">
            <span>Впервые у нас?</span>
            <a th:href="@{/registration}">Создать аккаунт</a>
        </div>
    </form>
</div>
</body>
</html>
