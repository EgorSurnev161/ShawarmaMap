<!-- templates/fragments/place-shawarma-card-fragment.html -->
<div th:fragment="placeCard(place)" class="place-card">
    <!-- Ссылка на детальную страницу по ID места -->
    <a th:href="@{'/place/' + ${place.id}}" style="text-decoration: none; color: inherit;">
        <img src="https://via.placeholder.com/300x180" alt="Shawarma" class="place-img">
        <div class="place-info">
            <h3 class="place-title" th:text="${place.name}">Название места</h3>
            <p class="place-address">
                <span th:text="${place.city}">Город</span>,
                <span th:text="${place.address}">Адрес</span>
            </p>
            <div class="stats-row">
                <div>
                    <span class="likes">👍 [[${place.numberOfLikes}]]</span>
                    <span class="dislikes">👎 [[${place.numberOfDislikes}]]</span>
                </div>
                <small th:text="${#temporals.format(place.createDate, 'dd.MM.yyyy')}">Дата</small>
            </div>
        </div>
    </a>
    <div th:if="${showDelete}" class="card-actions">
        <!-- Кнопка Редактировать -->
        <a th:href="@{'/account/update-place/' + ${place.id}}" class="btn-edit-card">
            <i class="fas fa-edit"></i> Редактировать
        </a>
        <!-- Форма удаления -->
        <form th:action="@{/account/delete-place}" method="post" onsubmit="return confirm('Вы уверены, что хотите удалить это место?');">
            <input type="hidden" name="id" th:value="${place.id}">
            <button type="submit" class="btn-delete-card" title="Удалить">
                <i class="fas fa-trash"></i> Удалить
            </button>
        </form>
    </div>
</div>
